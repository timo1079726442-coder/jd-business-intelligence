[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "__pycache__",
    "browser_data",
    "cdp_user_data",
    "data",
    "output",
    "logs",
    "rpa_temp",
    "*.py.bak",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
    "E731",
    "B008",
    "B904",
    "UP006",
    "UP007",
    "F401",
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E501", "F401", "F841", "B", "UP", "I001"]
"tests/*" = ["F401", "F811", "F841", "B011"]
"main_old_backup.py" = ["E", "W", "F", "B", "UP", "I"]

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_unittest.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]